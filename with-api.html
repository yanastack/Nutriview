<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriView — Nutrislice API Preview</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
    }
    body { overflow: hidden; }
  </style>
</head>
<body>
  <!--
    Safe integration preview: load the existing prototype unchanged, then inject
    nutrislice.js into it. This keeps index.html untouched while the API work is
    tested on its own branch.
  -->
  <iframe id="nutriview" src="index.html" title="NutriView"></iframe>

  <script>
    const frame = document.getElementById('nutriview');

    frame.addEventListener('load', () => {
      const script = frame.contentDocument.createElement('script');
      script.src = 'nutrislice.js';
      frame.contentDocument.body.appendChild(script);
    });
  </script>
</body>
</html>
